; NFSU2 Co-op default configuration.
; Copy this next to NFSU2Coop.asi as nfsu2coop.ini (install.ps1 does it).

[Coop]
; Host=1 starts a session on this PC; Host=0 joins Server.
Host=0
Server=127.0.0.1
Port=27970
Name=Player
Session=career
; Event id used by F6 (host: open) and F7 (guest: report done).
EventId=1

[Game]
PublishTraffic=1
SnapshotHz=20
CountdownMs=5000
MaxTraffic=20
MaxBots=6

[Overlay]
Enabled=1
VerboseLog=0

[Bindings]
; Offsets for YOUR speed2.exe build. All zeros = protocol-only mode:
; networking, lobby, race director, standings and career still work;
; car/traffic sync needs real values. See docs/GAME-BINDINGS.ru.md.
CarPointer=0
; Verified build defaults (speed2.exe 4,800,512 bytes, image 0x532000):
CarArray=0x89CCF8
CarIndex=0
CarStride=4
PosOffset=0x50
RotOffset=0x90
VelOffset=0
YawOffset=0
SpeedOffset=0
GearOffset=0
TrafficList=0
TrafficCount=0
TrafficStride=0
TrafficPosOffset=0
TrafficModelOffset=0
StartEvent=0
CareerCash=0
CareerRep=0
ZonePointer=0

